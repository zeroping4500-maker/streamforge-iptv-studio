name: 24/7 IPTV Stream Auto-Renew & M3U Export

on:
  schedule:
    # Hourly: televizo tokens live about an hour, so a four-hourly run left most
    # of the day unplayable. Fresh links are skipped, so each run only renews
    # the ones that are expiring.
    - cron: '0 * * * *'
  workflow_dispatch: # Allows one-click manual trigger from GitHub Actions tab

# Grants permissions to commit and push updated playlists back to the repo
permissions:
  contents: write

jobs:
  renew-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎭 Install Playwright Headless Chromium & System Libraries
        run: |
          playwright install --with-deps chromium

      - name: 🚀 Run Cloud Stream Renewal & M3U Export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing. Add the Neon connection string under Settings > Secrets and variables > Actions, so the renewer can reach the channel database."
            exit 1
          fi
          python cloud_renew.py

      - name: 💾 Commit & Push Fresh Playlists and Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ channels.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit. All streams are up-to-date."
          else
            git commit -m "Automated 5-Hour Stream Renewal & M3U Export [skip ci]"
            git push origin main
          fi
